version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor_track_db
    environment:
      POSTGRES_USER: tutortrack
      POSTGRES_PASSWORD: tutortrack_secret
      POSTGRES_DB: tutortrack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutortrack']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tutor_track_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tutortrack.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
